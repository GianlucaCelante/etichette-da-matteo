<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco lotti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Variabili del tema, identiche a ui/src/index.css */
  :root {
    --fondo: #EADECE; --testo: #58443C; --tenue: #7A6A5E; --spento: #9C8C7C;
    --carta: #ffffff; --crema: #FBF5EC; --sabbia: #F7F0E4; --riga: #EDE3D5; --bordo: #DCCFBB; --bordo2: #CFC0AA; --tratteggio: #C0AF9B;
    --verde: #5E7B18; --verdescuro: #4B6313; --verdechiaro: #E3EAD1; --verdebordo: #B9C89A;
    --ambra: #A97514; --ambrachiaro: #F7EBD3; --ambrabordo: #E5CB93;
    --rosso: #a3301a; --rossocupo: #8c3520; --rossochiaro: #fbe4e0; --rossobordo: #f0b5a8;
    --barra: #E4DACA; --ombra: 0 8px 24px rgba(88, 68, 60, 0.10);
  }

  /* ======= CSS dell'app, preso pari pari da ui/src/index.css (@layer components) ======= */
/*__CSS_APP__*/
  /* ======= fine CSS dell'app ======= */

  /* Cio' che nell'app arriva da Tailwind e qui serve come classe */
  body { overflow: hidden; font-size: 15px; }
  /* dentro un contenitore che scorre i figli non si stringono: altrimenti la striscia dei lotti (overflow hidden per gli
     angoli) e la cornice dell'anteprima si accorciano invece di far scorrere la colonna */
  .scorre > * { flex-shrink: 0; }
  textarea { font: inherit; color: inherit; }
  .areaTesto { border: 1px solid var(--bordo2); border-radius: 12px; background: #fff; padding: 10px 14px; font-size: 14px; line-height: 1.5; resize: vertical; width: 100%; }
  .areaTesto:focus { outline: none; }
  .selCasella { width: 100%; height: 50px; padding: 0 14px; background: transparent; border: 0; font: inherit; color: inherit; font-weight: 700; cursor: pointer; }
  .voceEt { width: 100%; text-align: left; padding: 8px 12px; border-radius: 10px; font-size: 15px; font-weight: 700; line-height: 1.2; }
  .voceEt .sotto { display: block; font-size: 12px; font-weight: 400; margin-top: 2px; color: var(--tenue); }
  .voceEt.scelto .sotto { color: inherit; }
  .nuovaEt { height: 44px; border: 1px dashed var(--tratteggio); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; color: #6B5A4E; margin-bottom: 4px; width: 100%; }
  .btnTratto { width: 100%; justify-content: center; background: transparent; border-style: dashed; border-color: var(--tratteggio); color: #6B5A4E; }
  .inline { display: flex; align-items: center; gap: 12px; }
  .inline > .etichettina { width: 138px; flex-shrink: 0; }
  .inline > .campoDentro { flex: 1; min-width: 0; }
  .mono { font-family: Consolas, "Courier New", monospace; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }
  .opz .testi .mono, .rl .lot .mono, .lotto .codice, .kv .mono, .catena .mono, .foglioStampa td:nth-child(2) { white-space: nowrap; }
  .b { font-weight: 700; }
  .tenue { color: var(--tenue); }
  .spentoT { color: var(--spento); }
  .nota12 { font-size: 12px; color: var(--spento); }
  .avvisoResa { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; color: var(--ambra); }
  .titoloScheda { font-size: 19px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv b { font-weight: 700; }
  .radioRiga { width: 100%; }
  .radioRiga .v { font-weight: 700; color: var(--testo); }

  /* anteprima finta: l'etichetta e' disegnata nel DOM, non una PNG del servizio */
  .cornice.finta { width: 100%; cursor: zoom-in; display: block; }
  .cornice.finta .foglio { padding: 8px 10px; font-family: Arial, Helvetica, sans-serif; color: #111; display: flex; flex-direction: column; gap: 2px; }
  .cornice.finta .due { display: grid; gap: 8px; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; padding: 3px 0; margin: 2px 0; }
  .cornice.finta .due > div + div { border-left: 1px solid #bbb; padding-left: 8px; }
  .cornice.finta.compatta .foglio { zoom: .72; }
  .lupa { pointer-events: none; }

  /* ---------- parti nuove: striscia guida del prototipo ---------- */
  .guida { display: flex; gap: 12px; align-items: flex-start; background: var(--crema); border: 1px dashed var(--verdebordo); border-radius: 14px; padding: 12px 16px; font-size: 13.5px; line-height: 1.45; color: var(--tenue); flex-shrink: 0; }
  .guida .tag { flex-shrink: 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--verdescuro); background: var(--verdechiaro); border-radius: 8px; padding: 3px 8px; margin-top: 1px; }
  .guida b { color: var(--testo); }
  .tagNuovo { font-family: "Atkinson Hyperlegible", system-ui, sans-serif; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--verdescuro); background: var(--verdechiaro); border-radius: 7px; padding: 2px 6px; vertical-align: middle; margin-left: 8px; }
  .voce, .tab { position: relative; }
  .voce .nuovo, .tab .nuovo { position: absolute; top: 4px; right: 6px; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; background: var(--ambra); color: #fff; border-radius: 8px; padding: 2px 5px; font-weight: 700; }

  /* stati dei lotti */
  .stato { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .stato.aperto { background: var(--verdechiaro); color: var(--verdescuro); }
  .stato.piu { background: var(--sabbia); color: var(--tenue); border: 1px solid var(--bordo); }
  .stato.chiuso { background: none; color: var(--spento); border: 1px solid var(--riga); }
  .stato.scaduto { background: var(--rossochiaro); color: var(--rossocupo); }
  .stato.scade, .stato.manca { background: var(--ambrachiaro); color: var(--ambra); }

  /* elenco ingredienti: le stesse carte di Stampa (.prodotto), con lo stato a destra */
  .prodotto .statoRiga { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  @media (max-width: 860px) { .prodotto .statoRiga { grid-column: 1; margin-top: 2px; } }

  /* una riga di lotto nella scheda dell'ingrediente: chiusa e' due righe, si apre toccandola */
  .lotto { border: 1px solid var(--bordo); border-radius: 14px; background: var(--carta); display: flex; flex-direction: column; }
  .lotto.aperto { border-color: var(--verdebordo); }
  .lotto.chiuso { opacity: .7; }
  .lotto.aperto2 { background: var(--crema); }
  .capoLotto { width: 100%; text-align: left; padding: 10px 14px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
  .lotto .chiudiRiga { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
  .lotto .riga1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lotto .codice { font-size: 16px; font-weight: 700; }
  .lotto .scad { margin-left: auto; font-size: 13px; color: var(--tenue); white-space: nowrap; }
  .lotto .riga2 { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--tenue); }
  .lotto .riga2 .testo { flex: 1; min-width: 0; line-height: 1.4; }
  .lotto .riga2 .icone { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .lotto .dettagli { display: flex; flex-direction: column; gap: 10px; padding: 10px 14px 14px; border-top: 1px solid var(--riga); }
  .lotto .usato { font-size: 13px; color: var(--tenue); line-height: 1.5; }
  .lotto .usato b { color: var(--testo); }
  .lotto .stato { height: 22px; font-size: 11.5px; padding: 0 8px; }
  .btn.piccolo { height: 38px; padding: 0 14px; font-size: 14px; gap: 7px; border-radius: 10px; }

  /* foto finte: un foglio con righe (fattura) o un cartellino (etichetta) */
  .foto { width: 58px; height: 74px; border-radius: 6px; border: 1px solid var(--bordo2); background: #fff; position: relative; overflow: hidden; flex-shrink: 0; cursor: zoom-in;
          box-shadow: 0 2px 6px rgba(88,68,60,.12); display: flex; flex-direction: column; justify-content: flex-end; }
  .foto::before { content: ""; position: absolute; inset: 8px 8px 22px; background: repeating-linear-gradient(to bottom, var(--bordo2) 0 1.5px, transparent 1.5px 6px); opacity: .7; }
  .foto.etichetta::before { inset: 10px 8px 24px; background: linear-gradient(var(--testo), var(--testo)) 0 0/60% 5px no-repeat, repeating-linear-gradient(to bottom, var(--bordo2) 0 1.5px, transparent 1.5px 5px) 0 10px/100% 100% no-repeat; }
  .foto.etichetta::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 24px; height: 9px; background: repeating-linear-gradient(to right, var(--testo) 0 1px, transparent 1px 3px, var(--testo) 3px 5px, transparent 5px 6px); }
  .foto span { position: relative; font-size: 9px; font-weight: 700; color: var(--tenue); background: var(--sabbia); padding: 3px 4px; line-height: 1.1; text-transform: uppercase; letter-spacing: .03em; }
  .foto.vuota { border-style: dashed; background: var(--crema); box-shadow: none; cursor: pointer; justify-content: center; align-items: center; color: var(--tenue); gap: 2px; }
  .foto.vuota::before, .foto.vuota::after { display: none; }
  .foto.vuota span { background: none; text-transform: none; letter-spacing: 0; text-align: center; font-size: 10px; }
  .fotoGrande { width: 100%; aspect-ratio: 3/4; max-height: 60vh; border-radius: 12px; border: 1px solid var(--bordo2); background: #fff; position: relative; overflow: hidden; }
  .fotoGrande::before { content: ""; position: absolute; inset: 10% 12% 20%; background: repeating-linear-gradient(to bottom, var(--bordo2) 0 2px, transparent 2px 12px); opacity: .8; }
  .fotoGrande::after { content: ""; position: absolute; left: 12%; top: 5%; width: 40%; height: 4%; background: var(--testo); }

  /* i lotti in uso nel pannello di stampa */
  .lottiStampa { border: 1px solid var(--bordo); border-radius: 14px; overflow: hidden; }
  .lottiStampa .capo { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--sabbia); border-bottom: 1px solid var(--riga); }
  .lottiStampa .capo .etichettina { flex: 1; }
  .rl { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--riga); font-size: 14px; }
  .rl:last-child { border-bottom: none; }
  .rl.attenzione { background: #FCF6E9; }
  .rl.grave { background: var(--rossochiaro); }
  .rl .testa { display: flex; align-items: center; gap: 10px; }
  .rl .ing { font-weight: 700; flex: 1; min-width: 0; }
  .rl .ing small { font-weight: 400; color: var(--tenue); font-size: 12px; margin-left: 6px; }
  .rl .cambia { font-size: 13px; font-weight: 700; color: var(--verdescuro); padding: 4px 8px; border-radius: 8px; white-space: nowrap; margin-right: -8px; }
  .rl .cambia:hover { background: var(--verdechiaro); }
  .rl .lot { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; }
  .rl .lot small { font-size: 12.5px; color: var(--tenue); }
  .rl .lot.manca { color: var(--ambra); font-weight: 700; }
  .rl .lot .quadro { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--bordo2); display: inline-flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .rl .lot .quadro.on { background: var(--verde); border-color: var(--verde); }
  .rl .lot.escluso .mono, .rl .lot.escluso small { color: var(--spento); text-decoration: line-through; }
  .rl .chiudi { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--spento); white-space: nowrap; padding: 2px 4px; border-radius: 6px; }
  .rl .chiudi:hover { background: var(--rossochiaro); color: var(--rosso); }
  .rl .vai { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--verdescuro); white-space: nowrap; }
  .rl .piu { font-size: 12px; color: var(--tenue); }
  .rl .nota { font-size: 12.5px; line-height: 1.4; padding-top: 2px; }
  .rl.attenzione .nota { color: var(--ambra); } .rl.grave .nota { color: var(--rossocupo); }
  @media (max-width: 860px) { .rl .lot { flex-wrap: wrap; } }
  /* i lotti chiusi dell'ingrediente, in una lista collassata sotto quelli aperti */
  .rl .apriChiusi { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--tenue); padding: 2px 0; width: fit-content; }
  .rl .apriChiusi .freccia { display: flex; color: var(--spento); }
  .rl .lottoChiuso { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--spento); padding: 2px 0; }
  .rl .lottoChiuso .mono { color: var(--spento); }
  .rl .lottoChiuso small { font-size: 12px; color: var(--tenue); }
  .rl .lottoChiuso .riapri { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--verdescuro); white-space: nowrap; }
  .rl .altriChiusi { font-size: 12px; color: var(--tenue); padding: 2px 0 2px 2px; }
  .scelta { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 4px; }
  .opz { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; border: 1px solid var(--bordo); border-radius: 10px; background: var(--carta); width: 100%; font-size: 14px; }
  .opz .scegli { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; padding: 3px 0; }
  .opz .btn.piccolo { height: 32px; padding: 0 10px; font-size: 12.5px; flex-shrink: 0; }
  .opz.on { border-color: var(--verde); box-shadow: 0 0 0 3px var(--verdechiaro); }
  .opz .testi { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .opz small { color: var(--tenue); font-size: 12px; }
  .spunta { display: flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 4px 2px; }
  .spunta .quadro { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--bordo2); display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .spunta.on .quadro { background: var(--verde); border-color: var(--verde); }

  /* tendina dei nomi simili sotto il campo Nome (Nuovo ingrediente e scheda ingrediente) */
  .campo.conTendina { position: relative; }
  .tendinaSimili { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; margin-top: 6px; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--carta); border: 1px solid var(--bordo2); border-radius: 12px; box-shadow: var(--ombra); max-height: 260px; overflow: auto; }
  .tendinaSimili:empty { display: none; }
  .tendinaSimili .titoloTendina { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--tenue); padding: 4px 8px 2px; }
  .tendinaSimili .voce { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; border-radius: 8px; padding: 6px 8px; }
  .tendinaSimili .voce:hover { background: var(--sabbia); }
  .tendinaSimili .voce .nome { font-weight: 700; font-size: 14px; }
  .tendinaSimili .voce .stessoNome { margin-left: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ambra); }
  .tendinaSimili .voce .dettaglio { font-size: 12px; color: var(--tenue); }

  /* ingredienti collegati (gruppo Ingredienti della scheda) */
  .collegati { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border: 1px solid var(--verdebordo); border-radius: 12px; background: #F6F9EE; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid var(--bordo2); background: var(--carta); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip.on { background: var(--testo); color: #fff; border-color: var(--testo); }
  .chip.aggiungi { border-style: dashed; border-color: var(--tratteggio); color: var(--tenue); font-weight: 400; }
  .chip .x { display: flex; color: var(--spento); }
  .chip.grande { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 19px; }
  @media (max-width: 860px) { .chip { height: 40px; padding: 0 13px; border-radius: 20px; font-size: 14px; } }

  /* merce arrivata: a sinistra il documento, a destra una scheda per ingrediente arrivato */
  .rigaArrivo { border: 1px solid var(--bordo); border-radius: 14px; background: var(--carta); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .rigaArrivo.proposta { border-style: dashed; border-color: var(--ambrabordo); background: #FFFBF3; }
  .rigaArrivo.attesa { border-style: dashed; border-color: var(--tratteggio); background: var(--crema); }
  .rigaArrivo .capo { display: flex; align-items: center; gap: 10px; }
  .rigaArrivo .capo .nome { font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; font-size: 17px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rigaArrivo .campi { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; }
  .rigaArrivo .campi .casella { min-height: 46px; font-size: 15px; }
  .rigaArrivo .piede { display: flex; align-items: center; gap: 10px; }
  .rigaArrivo .piede .nota12 { flex: 1; min-width: 0; }
  .fotoDoc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dueCampi { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 860px) { .dueCampi { grid-template-columns: 1fr; } }
  .capoArrivo { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
  .capoArrivo .nota { font-size: 12.5px; }
  @media (max-width: 860px) { .capoArrivo .nota { flex-basis: 100%; } }
  .proposta2 { border: 1px dashed var(--ambrabordo); background: var(--ambrachiaro); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.45; }
  .proposta2 .capo { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ambra); }
  .proposta2 .capo .tag { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; background: var(--ambra); color: #fff; border-radius: 8px; padding: 2px 6px; }
  @media (max-width: 860px) {
    .rigaArrivo .campi { grid-template-columns: 1fr 1fr; }
    .rigaArrivo .campi > .campo:first-child { grid-column: 1 / -1; }
  }

  /* la catena nello storico */
  .vocestorico.apribile { cursor: pointer; }
  .vocestorico.aperta { background: var(--crema); }
  .catena { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; padding: 8px 4px 12px; cursor: default; }
  .capoCatena { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--verdechiaro); color: var(--verdescuro); font-size: 14px; }
  .capoCatena b { font-size: 15px; }
  .anello { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 10px 14px; border: 1px solid var(--bordo); border-radius: 12px; background: var(--carta); }
  .anello .ing { font-weight: 700; }
  .anello .dati { font-size: 13px; color: var(--tenue); line-height: 1.45; min-width: 0; }
  .anello .dati b { color: var(--testo); }
  .anello .fotos { display: flex; gap: 6px; }
  .anello.manca { border-color: var(--ambrabordo); background: #FCF6E9; }
  .anello.manca .dati { color: var(--ambra); }
  .catenaLink { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 700; color: var(--verdescuro); }
  @media (max-width: 860px) {
    .anello { grid-template-columns: minmax(0, 1fr) auto; }
    .anello .ing { grid-column: 1 / -1; }
    .vocestorico.tel .catena { grid-column: 1 / -1; }
  }

  /* striscia dei lotti chiusa sul telefono; domanda al cambio sacco; correzione nello storico */
  .lottiStampa .riassunto { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: 14px; width: 100%; text-align: left; }
  .lottiStampa .riassunto .punta { margin-left: auto; display: flex; color: var(--spento); }
  .domanda { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--ambrabordo); background: var(--ambrachiaro); border-radius: 12px; font-size: 13.5px; }
  .domanda .capo { font-weight: 700; color: var(--ambra); }
  .domanda .scelte { display: flex; gap: 8px; flex-wrap: wrap; }
  .rl .lot .piu { font-size: 12px; color: var(--tenue); }
  .correggi { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
  .nota-corretto { font-size: 12.5px; color: var(--ambra); font-weight: 700; }
  /* il foglio stampabile della catena (per l'ASL o per un richiamo): dal browser, Ctrl+P */
  .finestra.foglio2 { width: min(760px, 100%); padding: 0; gap: 0; }
  .foglioStampa { padding: 28px 32px; font-size: 14px; line-height: 1.5; color: #111; background: #fff; }
  .foglioStampa h2 { font-size: 22px; margin-bottom: 4px; }

  }
  sinistra.append(el("h1", { className: "h titolo" }, titolo));
  const strumenti = el("div", { className: "strumentiEt testataStrumenti" });
  const azioni = el("div", { className: "testataAzioni", style: "display:flex;align-items:center;gap:10px;flex-wrap:wrap" });
  if (S.vista === "stampa" && !(tel() && S.dettaglio)) azioni.append(statoStampante());
  if (S.vista === "etichette" && prod(S.prodottoEt)) {
    strumenti.append(bottone("", { classe: "tondo", icona: I.annulla, iw: 18, title: "Annulla (Ctrl+Z)", disabilitato: true }), bottone("", { classe: "tondo", icona: I.ripristina, iw: 18, title: "Ripristina (Ctrl+Y)", disabilitato: true }), el("div", { className: "sep" }),
      bottone("Duplica", { classe: "conTesto", icona: I.duplica, iw: 17, onclick: () => avvisa("Nella demo: come oggi, copia l'etichetta con la sua etichetta e gli ingredienti collegati.") }),
      bottone("Elimina", { classe: "conTesto elimina", icona: I.cestino, iw: 17, onclick: () => avvisa("Nella demo non si elimina nulla.") }));
    azioni.append(bottone("Stampa di prova", { classe: "soloPC", icona: I.stampa, iw: 18, onclick: () => avvisa("Nella demo la stampa di prova non parte.") }), bottone("Salva etichetta", { classe: "primario", onclick: () => avvisa("Salvata: ingredienti collegati compresi.") }));
  }
  if (S.vista === "ingredienti" && !S.arrivo && !(tel() && S.dettaglioIng)) {
    azioni.append(tel() ? bottone("", { icona: I.piu, iw: 20, sw: 2.2, title: "Nuovo ingrediente", stile: "width:48px;padding:0", onclick: () => nuovoIngrediente() }) : bottone("Nuovo ingrediente", { icona: I.piu, iw: 18, sw: 2.2, onclick: () => nuovoIngrediente() }),
      bottone("Merce arrivata", { classe: "primario", icona: I.camion, iw: 18, onclick: () => apriArrivo() }));
  }
  if (S.vista === "storico") azioni.append(bottone("Esporta l'elenco", { classe: "soloPC", icona: I.scarica, iw: 18, onclick: () => avvisa("Elenco copiato: incollalo in un foglio di calcolo. Con la catena, una colonna per ogni lotto ingrediente.") }));
  if (S.vista === "ingredienti" && S.arrivo) {
    const n = S.arrivo.righe.filter(rigaDaRegistrare).length;
    azioni.append(bottone("Annulla", { onclick: () => { S.arrivo = null; if (S.tornaAStampa) { S.vista = "stampa"; S.prodotto = S.tornaAStampa.prodotto; S.dettaglio = true; S.tornaAStampa = null; } disegna(); } }), bottone(n ? `Registra ${plurale(n, "lotto", "lotti")}` : "Registra", { classe: "primario", disabilitato: !n, onclick: registraArrivo }));
  }
  testata.append(sinistra, strumenti, azioni);
  corpo.append(testata);

  corpo.append(S.vista === "stampa" ? vistaStampa() : S.vista === "etichette" ? vistaEtichette() : S.vista === "ingredienti" ? vistaIngredienti()
    : S.vista === "storico" ? vistaStorico() : vistaImpostazioni());

  const barra = el("nav", { className: "barrasotto" });
  for (const [k, t, d] of VOCI) {
    const v = el("button", { className: "tab" + (S.vista === k ? " on" : "") });
    v.innerHTML = ico(d) + `<span>${t}</span>`;
    v.onclick = () => vai(k, true);
    barra.append(v);
  }
  corpo.append(barra);
  cont.append(rail, corpo);
  app.append(cont);
  if (S.foto) app.append(finestraFoto());
  if (S.nuovoIng) app.append(finestraNuovoIngrediente());
  if (S.foglio) app.append(finestraFoglio());
  if (S.lenteAperta) app.append(lente());
  if (scorsi) app.querySelectorAll(".schermo, .scorre").forEach((e, i) => { if (scorsi[i]) e.scrollTop = scorsi[i]; });
  if (chiave) { const n = document.querySelector(`[data-fuoco="${chiave}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }
}
function vai(k, daBarra) {
  if (S.fase === "fatta") S.fase = null;
  if (S.fase === "stampa") return;
  // toccare di nuovo la voce riporta all'elenco, come si aspetta chi usa un telefono
  if (daBarra && S.vista === k) { S.dettaglio = false; S.dettaglioIng = false; S.arrivo = null; }
  S.vista = k; disegna();
}
addEventListener("resize", () => { clearTimeout(window._r); window._r = setTimeout(disegna, 120); });
addEventListener("keydown", e => { if (e.key === "Escape") { if (S.nuovoIng) { S.nuovoIng = null; disegna(); } else if (S.foto) { S.foto = null; disegna(); } else if (S.foglio) { S.foglio = null; disegna(); } else if (S.lenteAperta) { S.lenteAperta = false; disegna(); } } });
// #stampa, #etichette, #ingredienti, #storico, #impostazioni aprono la schermata direttamente;
// con un argomento dopo i due punti si apre anche l'elemento: #stampa:salsa, #ingredienti:olio, #storico:s5, #etichette:teglia
{
  const [v, arg] = location.hash.slice(1).split(":");
  if (v === "vuoto") S = vuota();
  if (TITOLI[v]) S.vista = v;
  if (arg) {
    if (v === "stampa" && prod(arg)) { S.prodotto = arg; S.dettaglio = true; }
    if (v === "etichette" && prod(arg)) S.prodottoEt = arg;
    if (v === "ingredienti" && ingr(arg)) { S.ingrediente = arg; S.dettaglioIng = true; }
    if (v === "storico") { S.aperta = arg; S.storicoFiltro = "tutto"; }
  }
}
disegna();
</script>
