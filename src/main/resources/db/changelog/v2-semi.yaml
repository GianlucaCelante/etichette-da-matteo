      author: etichette
      comment: "'Cucina': blocchi veri del prototipo (ETDEMO.cucina)."
      changes:
        - update:
            tableName: etichette
            columns:
              - column: {name: blocchi, value: '[{"tipo":"titolo","acceso":true,"corpo":14,"colonna":"piena"},{"tipo":"testo","acceso":true,"corpo":8,"colonna":"piena","testo":"Prodotto il 03/09/2026"},{"tipo":"scadenza","acceso":true,"corpo":8,"colonna":"piena"},{"tipo":"lotto","acceso":true,"corpo":7,"colonna":"piena"},{"tipo":"testo","acceso":true,"corpo":7,"colonna":"piena","testo":"Preparato da M.C."}]'}
