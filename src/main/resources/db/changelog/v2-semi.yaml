databaseChangeLog:
  # Fase 2: colonne aggiunte al modello (docs/api.md), correzione dei semi minimi della fase 1 con
  # i blocchi veri del prototipo, e i prodotti di esempio. Changeset con id nuovi: eseguiti UNA
  # VOLTA SOLA da Liquibase (tracciati in DATABASECHANGELOG) sia su un database creato da zero sia
  # su uno gia' creato dalla fase 1 - nessun rischio di duplicare le etichette/i prodotti gia'
  # seminati, e le UPDATE (per nome, unico) restano corrette anche se rieseguite a mano.

  - changeSet:
      id: 9-etichette-zona
      author: etichette
      comment: "Larghezza della colonna destra nella zona a due colonne (docs/api.md, zona.larghezzaDestra)."
      changes:
        # SQL diretto invece di addColumn: il generatore SQLite di Liquibase ricostruisce sempre
        # la tabella per un addColumn (SQLite non supporta ALTER TABLE ... ALTER COLUMN) e va in
        # errore (IndexOutOfBoundsException in SQLiteDatabase.getAlterTableStatements) su tabelle
        # con chiave esterna come "prodotti" (etichetta_id -> etichette); SQLite supporta pero'
        # nativamente un semplice ALTER TABLE ADD COLUMN senza vincoli, usato qui direttamente.
        - sql:
            sql: "ALTER TABLE etichette ADD COLUMN zona_larghezza_destra TEXT;"

  - changeSet:
      id: 10-prodotti-nome-stampa
      author: etichette
      comment: "Nome stampato nel blocco titolo, se diverso dal nome del prodotto (docs/api.md)."
      changes:
        - sql:
            sql: "ALTER TABLE prodotti ADD COLUMN nome_stampa TEXT;"

  - changeSet:
      id: 11-correggi-schema-lotto
      author: etichette
      comment: "La fase 1 aveva seminato 'data_progressivo': il contratto (docs/api.md) usa 'data'."
      changes:
        - update:
            tableName: impostazioni
            columns:
              - column: {name: valore, value: "data"}
            where: "chiave = 'schema_lotto' AND valore = 'data_progressivo'"

  - changeSet:
      id: 12-seed-progressivo-continuo
      author: etichette
      comment: "Progressivo dello schema di lotto 'continuo' (docs/api.md), mancante nel seme della fase 1."
      changes:
        - insert:
            tableName: impostazioni
            columns:
              - column: {name: chiave, value: progressivo_continuo}
              - column: {name: valore, value: "0"}

  - changeSet:
      id: 13-etichette-blocchi-completa
      author: etichette
      comment: "'Completa': blocchi, dicitura, formato e produttore veri (docs/api.md, esempio dell'Etichetta = questa stessa etichetta)."
      changes:
        - update:
            tableName: etichette
            columns:
              - column: {name: blocchi, value: '[{"tipo":"titolo","acceso":true,"corpo":18,"colonna":"piena"},{"tipo":"ingredienti","acceso":true,"corpo":7,"colonna":"piena"},{"tipo":"puoContenere","acceso":true,"corpo":7,"colonna":"piena"},{"tipo":"modoUso","acceso":false,"corpo":7,"colonna":"piena"},{"tipo":"scadenza","acceso":true,"corpo":8,"colonna":"sx"},{"tipo":"lotto","acceso":true,"corpo":7,"colonna":"sx"},{"tipo":"quantita","acceso":true,"corpo":28,"colonna":"sx"},{"tipo":"valori","acceso":true,"corpo":7,"colonna":"dx"},{"tipo":"produttore","acceso":true,"corpo":7,"colonna":"piena"}]'}
              - column: {name: dicitura_scadenza, value: "da consumare entro"}
              - column: {name: formato_data, value: "GG/MM/AAAA"}
              - column: {name: produttore_ragione_sociale, value: "Michi s.n.c. di Michele Alberto Crivellari"}
              - column: {name: produttore_sede_legale, value: "Via Brigata Marche 257 - 31030 Carbonera (TV)"}
              - column: {name: produttore_sede_produzione, value: "Via Trieste 4/II - 31020 Fontane di Villorba (TV)"}
              - column: {name: zona_larghezza_destra, value: "1/3"}
              - column: {name: creata_il, value: "2026-09-08 00:00:00.000"}
              - column: {name: modificata_il, value: "2026-09-08 00:00:00.000"}
            where: "nome = 'Completa'"

  - changeSet:
