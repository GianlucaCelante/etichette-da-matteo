            where: "nome = 'Aperto il / Scade il'"

  - changeSet:
      id: 16-etichette-blocchi-libera
      author: etichette
      comment: "'Libera': nessun blocco, l'utente la compone da zero (docs/funzionalita-prima-versione.md)."
      changes:
        - update:
            tableName: etichette
            columns:
              - column: {name: blocchi, value: "[]"}
              - column: {name: creata_il, value: "2026-09-08 00:00:00.000"}
              - column: {name: modificata_il, value: "2026-09-08 00:00:00.000"}
