databaseChangeLog:
  # Tracciabilita' della catena (docs/api.md, "Ingredienti collegati a un prodotto" / "Stampa:
  # quali lotti si registrano" / "Storico: la catena", deciso il 22 settembre 2026): chi tracciare
  # per un prodotto (prodotti_tracciati) e cosa ha registrato ogni stampa (storico_lotti). Una
  # riga di storico_lotti = un lotto registrato (o la stampa tracciata di un semilavorato); una
  # riga con lotto_id e stampa_storico_id entrambi nulli e' un "non registrato" (il tracciato non
  # aveva niente da registrare, ma la stampa si fa lo stesso: la tracciabilita' non deve mai
  # impedire di lavorare).

  - changeSet:
      id: 40-prodotti-tracciati
      author: etichette
      comment: >
        Chi tracciare per un prodotto, nell'ordine scelto (docs/api.md, campo "tracciati" di
        GET/PUT /api/prodotti/{id}): esattamente uno fra ingrediente_id e prodotto_tracciato_id e'
        valorizzato (un ingrediente dell'anagrafica, o un altro prodotto - un semilavorato, il cui
        "lotto" e' l'ultima stampa non scaduta di quel prodotto). Indice su prodotto_id: e' il
        filtro di ogni lettura/scrittura dei tracciati di un prodotto.
      changes:
        - createTable:
            tableName: prodotti_tracciati
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: prodotto_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    references: prodotti(id)
                    foreignKeyName: fk_prodotti_tracciati_prodotto
              - column:
                  name: posizione
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: ingrediente_id
                  type: INTEGER
                  constraints:
                    references: ingredienti(id)
                    foreignKeyName: fk_prodotti_tracciati_ingrediente
              - column:
                  name: prodotto_tracciato_id
                  type: INTEGER
                  constraints:
                    references: prodotti(id)
                    foreignKeyName: fk_prodotti_tracciati_prodotto_tracciato
        - createIndex:
            indexName: idx_prodotti_tracciati_prodotto
            tableName: prodotti_tracciati
            columns:
              - column:
                  name: prodotto_id

  - changeSet:
      id: 41-storico-lotti
      author: etichette
      comment: >
        Cosa ha registrato una stampa (docs/api.md, "Stampa: quali lotti si registrano" e
        "Storico: la catena"): una riga per lotto scelto di un ingrediente tracciato
        (ingrediente_id + lotto_id), o per la stampa tracciata di un semilavorato
        (prodotto_tracciato_id + stampa_storico_id). Indici su storico_id (la catena di UNA
        stampa) e lotto_id (il foglio di richiamo di UN lotto, GET /api/lotti-ingrediente/{id}/usi).
      changes:
        - createTable:
            tableName: storico_lotti
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: storico_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    references: storico_stampe(id)
                    foreignKeyName: fk_storico_lotti_storico
              - column:
                  name: ingrediente_id
                  type: INTEGER
                  constraints:
                    references: ingredienti(id)
                    foreignKeyName: fk_storico_lotti_ingrediente
              - column:
                  name: prodotto_tracciato_id
                  type: INTEGER
                  constraints:
                    references: prodotti(id)
                    foreignKeyName: fk_storico_lotti_prodotto_tracciato
              - column:
                  name: lotto_id
                  type: INTEGER
                  constraints:
                    references: lotti_ingrediente(id)
                    foreignKeyName: fk_storico_lotti_lotto
              - column:
                  name: stampa_storico_id
                  type: INTEGER
                  constraints:
                    references: storico_stampe(id)
                    foreignKeyName: fk_storico_lotti_stampa_storico
        - createIndex:
            indexName: idx_storico_lotti_storico
            tableName: storico_lotti
            columns:
              - column:
                  name: storico_id
        - createIndex:
            indexName: idx_storico_lotti_lotto
            tableName: storico_lotti
            columns:
              - column:
                  name: lotto_id

  - changeSet:
      id: 42-storico-corretto-il
      author: etichette
      comment: "PUT /api/storico/{id}/catena scrive qui quando corregge a mano i lotti di una stampa gia' fatta (docs/api.md)."
      changes:
        - addColumn:
            tableName: storico_stampe
            columns:
              - column:
                  name: corretto_il
                  type: TEXT
