server:
  port: 8765
  # Risposte compresse (gzip) se il browser le accetta: soprattutto il JSON dello storico, che
  # i telefoni scaricano in Wi-Fi (docs/api.md, "Storico"), e il JavaScript dell'interfaccia.
  # text/event-stream NON va in elenco, e non ci deve finire: /api/eventi (SSE) manda un evento
  # alla volta e il compressore di Tomcat lo tratterrebbe nel suo buffer invece di consegnarlo
  # subito - stato della stampante e avanzamento delle stampe arriverebbero in ritardo o mai.
  # Le PNG dell'anteprima non ci sono perche' sono gia' compresse. Sotto i 2 KB non conviene.
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,text/javascript,application/javascript,text/plain,image/svg+xml
    min-response-size: 2KB

spring:
  application:
    name: etichette
  datasource:
    # date_class=TEXT: sqlite-jdbc scriverebbe di default un LocalDateTime come intero
    # (epoch millis, date_class=integer), ma hibernate-community-dialects lo rilegge sempre
    # come stringa formattata ("yyyy-MM-dd HH:mm:ss.SSS") - senza questo parametro la lettura
    # di QUALSIASI colonna data scritta da Hibernate fallisce con "Error parsing time stamp"
    # (scoperto in fase 2, mai esercitato in fase 1: nessun test rileggeva prima una colonna
    # data attraverso JPA). Con date_class=TEXT scrittura e lettura usano lo stesso formato.
    # busy_timeout=10000: se un'altra connessione sta scrivendo, aspetta fino a 10 s prima di
    # rispondere SQLITE_BUSY invece di fallire subito (osservato nel log del servizio installato:
    # "SQL Error: 5" con risposte 500 quando il browser apre l'app e parte con piu' richieste in
    # parallelo, quasi certamente scritture concorrenti di ultimo_accesso in DispositivoInterceptor).
    url: jdbc:sqlite:${etichette.dati}/etichette.db?journal_mode=WAL&date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss.SSS&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite ha un solo scrittore alla volta: con piu' connessioni nel pool ognuna crede di
      # poter scrivere e si arriva comunque a SQLITE_BUSY (busy_timeout aiuta ma non elimina il
      # rischio con scritture concorrenti lunghe). Con una sola connessione tutto l'accesso al
      # database - letture comprese - passa da un'unica coda: piu' lento in teoria, ma per il
      # carico di questo servizio (poche richieste al secondo da una rete locale) e' la scelta
      # piu' robusta, e in pratica non misurabile.
      maximum-pool-size: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # I limiti del contratto sono 2 MB per il logo (ImpostazioniController) e 8 MB per le foto
      # di lotti e documenti (FotoService, 22 settembre 2026); questo e' solo il tetto del
      # contenitore servlet, un po' piu' alto cosi' un file di 8 MB esatti arriva sempre al nostro
      # controllo - che risponde con l'errore giusto - e non a un rifiuto generico di Spring.
      max-file-size: 10MB
      max-request-size: 10MB

etichette:
  # Cartella dati: creata all'avvio se manca (vedi EtichetteApplication.main). Sovrascrivibile
  # con la variabile d'ambiente ETICHETTE_DATA_DIR (usata dall'installer per ProgramData\Etichette).
  dati: ${ETICHETTE_DATA_DIR:./data}
  cors:
    origine-sviluppo: http://localhost:5173
  stampante:
    # A false, MonitorStampante non cerca ne' apre mai la porta USB (resta sempre "scollegata"):
    # serve per far girare una seconda istanza di sviluppo/revisione sullo stesso PC senza
    # contendersi la stampante col servizio installato (mandato del 2026-09-08).
    abilitata: ${ETICHETTE_STAMPANTE_ABILITATA:true}

logging:
  # La console (catturata da WinSW in Etichette_<data>.out.log) usa la codepage di Windows
  # e rovinava le lettere accentate («Ragù»): si forza UTF-8 come nel file.
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: ${etichette.dati}/log/etichette.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
