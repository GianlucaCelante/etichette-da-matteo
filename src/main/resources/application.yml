server:
  port: 8765

spring:
  application:
    name: etichette
  datasource:
    # date_class=TEXT: sqlite-jdbc scriverebbe di default un LocalDateTime come intero
    # (epoch millis, date_class=integer), ma hibernate-community-dialects lo rilegge sempre
    # come stringa formattata ("yyyy-MM-dd HH:mm:ss.SSS") - senza questo parametro la lettura
    # di QUALSIASI colonna data scritta da Hibernate fallisce con "Error parsing time stamp"
    # (scoperto in fase 2, mai esercitato in fase 1: nessun test rileggeva prima una colonna
    # data attraverso JPA). Con date_class=TEXT scrittura e lettura usano lo stesso formato.
    url: jdbc:sqlite:${etichette.dati}/etichette.db?journal_mode=WAL&date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss.SSS
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

etichette:
  # Cartella dati: creata all'avvio se manca (vedi EtichetteApplication.main). Sovrascrivibile
  # con la variabile d'ambiente ETICHETTE_DATA_DIR (usata dall'installer per ProgramData\Etichette).
  dati: ${ETICHETTE_DATA_DIR:./data}
  cors:
    origine-sviluppo: http://localhost:5173

logging:
  file:
    name: ${etichette.dati}/log/etichette.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
