server:
  port: 8765

spring:
  application:
    name: etichette
  datasource:
    url: jdbc:sqlite:${etichette.dati}/etichette.db?journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

etichette:
  # Cartella dati: creata all'avvio se manca (vedi EtichetteApplication.main). Sovrascrivibile
  # con la variabile d'ambiente ETICHETTE_DATA_DIR (usata dall'installer per ProgramData\Etichette).
  dati: ${ETICHETTE_DATA_DIR:./data}
  cors:
    origine-sviluppo: http://localhost:5173

logging:
  file:
    name: ${etichette.dati}/log/etichette.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
